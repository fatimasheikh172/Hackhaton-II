# SpecKit Configuration
project:
  name: "hackathon-todo"
  type: "monorepo"
  phases:
    - "phase2-web"
  current_phase: "phase2-web"

directories:
  specs: "specs"
  frontend: "frontend"
  backend: "backend"
  docs: "docs"
  history: "history"

templates:
  spec: ".specify/templates/spec-template.md"
  plan: ".specify/templates/plan-template.md"
  tasks: ".specify/templates/tasks-template.md"
  phr: ".specify/templates/phr-template.prompt.md"

commands:
  build: "npm run build"
  test: "npm run test"
  dev: "npm run dev"